# Locust Configuration File
# Configuración para pruebas de carga con Locust

# URL base de la API
host = http://localhost:8000

# Número de usuarios virtuales a simular
users = 10

# Tasa de generación de usuarios por segundo
spawn-rate = 2

# Duración de la prueba en segundos (0 = infinito, hasta que se detiene manualmente)
run-time = 300

# Número de workers para ejecución distribuida (1 = modo standalone)
workers = 1

# Verbosidad
loglevel = INFO

# CSV para guardar resultados
csv = results

# Generar reporte HTML
html = report.html
